name: project-checks

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Verify pinned EPIC provenance
        run: ./scripts/verify_upstream.sh
      - name: Lint
        run: python -m ruff check src tests
      - name: Type check
        run: python -m mypy src
      - name: Unit and exact-commit tests
        run: python -m pytest -q tests/unit tests/exact_commit

  rust-correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bootstrap production Rust binding
        run: make bootstrap-rust-parser
      - name: Check Rust crates
        run: make test-rust-parser
      - name: Run complete suite with production binding
        run: .venv/bin/python -m pytest -q tests/unit tests/exact_commit
      - name: Run normal M6 finite-lattice campaign
        run: |
          .venv/bin/python scripts/exact_commit/run_m6_finite_lattice_differential.py \
            --campaign normal
      - name: Run normal M7 EOS finite-slot campaign
        run: |
          .venv/bin/python scripts/exact_commit/run_m7_eos_finite_slot_differential.py \
            --campaign normal
