name: project-checks

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Verify pinned EPIC provenance
        run: ./scripts/verify_upstream.sh
      - name: Lint
        run: python -m ruff check src tests
      - name: Type check
        run: python -m mypy src
      - name: Unit and exact-commit tests
        run: python -m pytest -q tests/unit tests/exact_commit

  rust-correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bootstrap production Rust binding
        run: make bootstrap-rust-parser
      - name: Check Rust crates
        run: make test-rust-parser
      - name: Run complete suite with production binding
        run: .venv/bin/python -m pytest -q tests/unit tests/exact_commit
      - name: Run normal M6 finite-lattice campaign
        run: |
          .venv/bin/python scripts/exact_commit/run_m6_finite_lattice_differential.py \
            --campaign normal
      - name: Run normal M7 EOS finite-slot campaign
        run: |
          .venv/bin/python scripts/exact_commit/run_m7_eos_finite_slot_differential.py \
            --campaign normal
      - name: Run Q1 correctness smoke
        run: |
          .venv/bin/python scripts/exact_commit/run_q1_correctness.py \
            --run-directory "$RUNNER_TEMP/q1-correctness"

  epic-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bootstrap pinned EPIC CPU environment
        run: make bootstrap-epic
      - name: Run pinned EPIC integration tests
        run: PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/integration
      - name: Build exact Rust binding for Q2
        run: cd crates/mwpc_parser_py && ../../.venv/bin/maturin develop --release
      - name: Run Q2 heuristic-gap smoke
        run: |
          .venv/bin/python scripts/exact_commit/run_q2_heuristic_gap.py \
            --run-directory "$RUNNER_TEMP/q2-heuristic-gap"
