name: apply-reviewed-corrections

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/apply_review_fixes.py"
      - ".github/workflows/apply-review-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-reviewed-corrections
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply deterministic corrections
        run: python scripts/apply_review_fixes.py
      - name: Install development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Verify source and run static checks
        run: |
          ./scripts/verify_upstream.sh
          python -m ruff check src tests
          python -m mypy src
          python -m compileall -q src tests
          git diff --check
      - name: Run complete lightweight correctness suite
        run: python -m pytest -q tests/unit tests/exact_commit
      - name: Re-run the extended M3 campaign on the corrected tree
        run: |
          python scripts/exact_commit/run_m3_differential.py \
            --output /tmp/m3-differential-summary.json \
            --failure-dir /tmp/m3-differential-failures
      - name: Remove one-shot machinery and commit the reviewed fixes
        run: |
          rm -f scripts/apply_review_fixes.py .github/workflows/apply-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce support scope and correctness gates"
          git push origin HEAD:main
