name: apply-m7-cleanup

on:
  push:
    branches: ["cleanup-m7-organization"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-m7-cleanup
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply focused cleanup
        run: python scripts/apply_m7_cleanup.py
      - name: Bootstrap independent Rust parser
        run: make bootstrap-rust-parser
      - name: Run Python checks
        run: |
          .venv/bin/python -m ruff check src tests
          .venv/bin/python -m mypy src
          .venv/bin/python -m pytest -q tests/unit tests/exact_commit
          .venv/bin/python -m compileall -q src tests
      - name: Run Rust checks
        run: make test-rust-parser
      - name: Replay normal M6 finite-lattice campaign
        run: |
          .venv/bin/python scripts/exact_commit/run_m6_finite_lattice_differential.py \
            --campaign normal
      - name: Check patch cleanliness
        run: git diff --check
      - name: Commit validated cleanup
        run: |
          rm -f scripts/apply_m7_cleanup.py .github/workflows/apply-m7-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: simplify repository before M7 implementation"
          git push origin HEAD:cleanup-m7-organization
