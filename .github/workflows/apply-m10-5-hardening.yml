name: apply-m10-5-hardening

on:
  push:
    branches: ["m10-5-hardening"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-m10-5-hardening
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct and apply verified hardening patch
        run: |
          cat .m10_5_gz/part-* | base64 -d | gzip -dc > scripts/apply_m10_5_hardening.py
          python -m py_compile scripts/apply_m10_5_hardening.py
          python scripts/apply_m10_5_hardening.py
          python - <<'PY'
          from pathlib import Path

          path = Path("src/mwpc_exact/epic_adapter/llada.py")
          text = path.read_text(encoding="utf-8")
          helper = '''def _integer(value: object, field_name: str) -> int:
              if isinstance(value, bool) or not isinstance(value, int):
                  raise TypeError(f"{field_name} must be an integer")
              if value < 0:
                  raise ValueError(f"{field_name} must be non-negative")
              return value
          '''
          if text.count(helper) != 1:
              raise RuntimeError("expected one late LLaDA _integer helper")
          marker = "@dataclass(frozen=True, slots=True)\nclass LLaDAAdapterProfile:"
          if text.count(marker) != 1:
              raise RuntimeError("LLaDA adapter profile marker is not unique")
          text = text.replace(helper, "", 1)
          text = text.replace(marker, helper + "\n\n" + marker, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Repair generated typing inference
        run: |
          python - <<'PY'
          from pathlib import Path

          ranked_path = Path("src/mwpc_exact/ranked_support.py")
          ranked = ranked_path.read_text(encoding="utf-8")
          old_ranked = "            ranked = ()\n"
          new_ranked = "            ranked: tuple[int, ...] = ()\n"
          if ranked.count(old_ranked) != 1:
              raise RuntimeError("ranked-support inferred tuple marker is not unique")
          ranked_path.write_text(ranked.replace(old_ranked, new_ranked), encoding="utf-8")

          llada_path = Path("src/mwpc_exact/epic_adapter/llada.py")
          llada = llada_path.read_text(encoding="utf-8")
          start = llada.index("def _witness_probabilities_from_model_logits(")
          end = llada.index("\n\ndef prepare_llada_exact_step(", start)
          block = llada[start:end]
          old_assignment = '    rows = _sequence(value, "logits")\n'
          if block.count(old_assignment) != 1:
              raise RuntimeError("witness-probability fallback assignment is not unique")
          block = block.replace(
              old_assignment,
              '    raw_rows = _sequence(value, "logits")\n',
              1,
          )
          block = block.replace("    if len(rows) != expected_length:\n", "    if len(raw_rows) != expected_length:\n", 1)
          block = block.replace(
              "enumerate(rows[prompt_length:expected_length])",
              "enumerate(raw_rows[prompt_length:expected_length])",
              1,
          )
          llada_path.write_text(llada[:start] + block + llada[end:], encoding="utf-8")
          PY
      - name: Normalize Python sources
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ruff>=0.6'
          python -m ruff format src tests
          python - <<'PY'
          from pathlib import Path

          path = Path("src/mwpc_exact/evaluation/__init__.py")
          text = path.read_text(encoding="utf-8")
          old = '__all__ = [name for name in globals() if not name.startswith("_")]'
          names = [
              "AlignmentCase",
              "SemanticAlignmentEvidence",
              "alignment_evidence_from_instance",
              "validate_semantic_alignment",
              "select_brute_force",
              "select_brute_force_graph",
              "EPIC_UPSTREAM_COMMIT",
              "EpicSelectionContext",
              "select_epic",
              "select_epic_regular_cover",
              "BENCHMARK_INSTANCE_ARTIFACT_KIND",
              "BENCHMARK_INSTANCE_SCHEMA_VERSION",
              "BenchmarkGrammar",
              "BenchmarkInstance",
              "EpicReplaySpec",
              "SavedLogits",
              "UnsupportedBenchmarkSchemaVersion",
              "migrate_benchmark_instance_data",
              "EpicCfgFactory",
              "replay_benchmark_instance",
              "SelectionInput",
              "SelectionResult",
              "SelectionStatus",
              "SelectorKind",
              "recompute_witness_selection",
              "select_exact",
              "select_exact_mwpc",
              "select_greedy_exact_feasibility",
              "select_serial",
              "validate_ordinary_primary_proposal_comparison",
          ]
          replacement = "__all__ = [\n" + "".join(f'    "{name}",\n' for name in names) + "]"
          if old not in text:
              raise RuntimeError("evaluation __all__ marker not found")
          path.write_text(text.replace(old, replacement), encoding="utf-8")
          PY
          python -m ruff check --fix src tests
          python -m ruff format src tests
          python -m ruff check src tests
      - name: Bootstrap pinned EPIC and production Rust environments
        run: |
          make bootstrap-epic
          cd crates/mwpc_parser_py
          ../../.venv/bin/maturin develop --release
      - name: Run complete Python and EPIC integration checks
        run: |
          make check
          PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m pytest -q tests/integration
      - name: Run Rust checks
        run: make test-rust-parser
      - name: Replay normal correctness campaigns
        run: |
          .venv/bin/python scripts/exact_commit/run_m6_finite_lattice_differential.py --campaign normal
          .venv/bin/python scripts/exact_commit/run_m7_eos_finite_slot_differential.py --campaign normal
          git restore docs/evidence
      - name: Compile article and inspect patch
        run: |
          make paper
          git diff --check
      - name: Commit validated hardening tree
        run: |
          rm -rf .m10_5_gz .m10_5_patch .m10_5_patch_small
          rm -f scripts/apply_m10_5_hardening.py .github/workflows/apply-m10-5-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: harden evaluation boundary before M11"
          git push origin HEAD:m10-5-hardening
