name: apply-post-m8-review

on:
  push:
    branches: ["post-m8-review-fixes"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-post-m8-review
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply focused fixes
        run: |
          python scripts/hotfix_apply_post_m8_review.py
          python scripts/apply_post_m8_review.py
          python scripts/post_apply_import_fixes.py
          python scripts/post_apply_test_fixes.py
      - name: Bootstrap production binding
        run: make bootstrap-rust-parser
      - name: Format generated Python changes
        run: .venv/bin/python -m ruff check --fix src tests
      - name: Run Python quality and complete tests
        run: |
          .venv/bin/python -m ruff check src tests
          .venv/bin/python -m mypy src
          .venv/bin/python -m pytest -q tests/unit tests/exact_commit
          .venv/bin/python -m compileall -q src tests
      - name: Run Rust checks
        run: make test-rust-parser
      - name: Replay normal M6 and M7 campaigns
        run: |
          .venv/bin/python scripts/exact_commit/run_m6_finite_lattice_differential.py --campaign normal
          .venv/bin/python scripts/exact_commit/run_m7_eos_finite_slot_differential.py --campaign normal
      - name: Install LaTeX for article validation
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-portuguese texlive-science poppler-utils
      - name: Compile the article
        run: make paper
      - name: Preserve immutable evidence and check patch
        run: |
          git checkout -- docs/evidence
          git diff --check
      - name: Commit validated fixes
        run: |
          rm -f \
            scripts/apply_post_m8_review.py \
            scripts/hotfix_apply_post_m8_review.py \
            scripts/post_apply_import_fixes.py \
            scripts/post_apply_test_fixes.py \
            .github/workflows/apply-post-m8-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: tighten production boundaries before M9"
          git push origin HEAD:post-m8-review-fixes
