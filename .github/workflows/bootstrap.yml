name: bootstrap-integrity

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Materialize and verify immutable source snapshot
        run: python scripts/materialize.py
      - name: Install lightweight development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Verify pinned EPIC provenance
        run: ./scripts/verify_upstream.sh
      - name: Lint
        run: python -m ruff check src tests
      - name: Type check
        run: python -m mypy src
      - name: Unit tests
        run: python -m pytest -q tests/unit
