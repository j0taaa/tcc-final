name: m3-extended-correctness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/mwpc_exact/**"
      - "tests/exact_commit/**"
      - "configs/exact_commit/m3_differential.toml"
      - "scripts/exact_commit/run_m3_differential.py"
      - ".github/workflows/m3-extended.yml"

permissions:
  contents: read

jobs:
  differential-campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run configured extended M3 campaign
        run: |
          python scripts/exact_commit/run_m3_differential.py \
            --output /tmp/m3-differential-summary.json \
            --failure-dir /tmp/m3-differential-failures
      - name: Print campaign summary
        if: always()
        run: |
          if [[ -f /tmp/m3-differential-summary.json ]]; then
            cat /tmp/m3-differential-summary.json
          fi
