name: materialize-agent-ready-repository

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-agent-ready-repository
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop when the full workspace is already present
        id: state
        shell: bash
        run: |
          if [[ -f PROJECT_MATERIALIZED ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone and expand the prepared source workspace
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch exact-cfg-dllm --single-branch \
            https://github.com/j0taaa/tcc.git /tmp/exact-cfg-source
          python /tmp/exact-cfg-source/scripts/materialize.py

          rsync -a \
            --exclude='.git/' \
            --exclude='.bootstrap/' \
            --exclude='.gitmodules' \
            --exclude='vendor/EPIC-Decoding/' \
            /tmp/exact-cfg-source/ ./

          rm -rf .bootstrap vendor/EPIC-Decoding
          rm -f .gitmodules

      - name: Adapt repository references and CI to tcc-final
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace(
              "git clone --branch exact-cfg-dllm --recurse-submodules \\\n  https://github.com/j0taaa/tcc.git exact-cfg-dllm\ncd exact-cfg-dllm",
              "git clone --recurse-submodules https://github.com/j0taaa/tcc-final.git\ncd tcc-final",
          )
          text = text.replace("j0taaa/tcc", "j0taaa/tcc-final")
          text = text.replace("branch `exact-cfg-dllm`", "branch `main`")
          readme.write_text(text, encoding="utf-8")

          ci = Path(".github/workflows/ci.yml")
          ci_text = ci.read_text(encoding="utf-8")
          ci_text = ci_text.replace('branches: ["exact-cfg-dllm"]', 'branches: ["main"]')
          ci.write_text(ci_text, encoding="utf-8")
          PY

          cat > PROJECT_MATERIALIZED <<'EOF'
          Exact CFG dLLM workspace materialized from the verified source prepared in
          j0taaa/tcc@exact-cfg-dllm. The definitive repository is j0taaa/tcc-final.
          EPIC is pinned as a read-only submodule at
          5b1b31098f34ed3691d2a9f4aae14fdf5839d072.
          EOF

      - name: Add the pinned EPIC baseline as a submodule
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git submodule add https://github.com/hyundong98/EPIC-Decoding.git vendor/EPIC-Decoding
          git -C vendor/EPIC-Decoding checkout 5b1b31098f34ed3691d2a9f4aae14fdf5839d072

      - name: Run lightweight repository checks
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ./scripts/verify_upstream.sh
          python -m ruff check src tests
          python -m mypy src
          python -m pytest -q tests/unit

      - name: Commit the definitive workspace
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize agent-ready exact CFG dLLM workspace"
          git push origin HEAD:main
