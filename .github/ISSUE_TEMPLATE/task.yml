name: Implementation task
about: Track one TASKS.md item with reproducible evidence
body:
  - type: input
    id: task
    attributes:
      label: TASKS.md ID
      placeholder: T000
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Scientific contract
      description: State the invariant and exactness scope this work must preserve.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Copy the relevant criteria from TASKS.md.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence when completed
      description: Commands, outputs, seeds, artifacts and commit SHA.
