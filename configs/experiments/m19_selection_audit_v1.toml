schema_version = 1
experiment_id = "m19_selection_audit_v1"
question = "heuristic_gap"
description = "Audit exact against original and witness-reuse greedy on every saved confirmation state."
publication_mode = false
seeds = [170302]
repetitions = 3

[exactness]
scope = "exact_on_support"
guarantee = "per_step"
require_independent_certificate = true

[support]
policy = "generated_top_k_or_explicit_per_position"
top_k = 2
k_max = 8
finite_slots = true

[model]
model_id = "GSAI-ML/LLaDA-8B-Instruct"
model_revision = "08b83a6feb34df1a6011b80c3c00c7563e963b07"
tokenizer_id = "GSAI-ML/LLaDA-8B-Instruct"
tokenizer_revision = "08b83a6feb34df1a6011b80c3c00c7563e963b07"
local_files_only = true

[grammar]
grammar_id = "recursive_nonliteral_families_v1"
source = "src/mwpc_research/recursive_tasks.py"
revision = "m19_selection_audit_v1"
hash_policy = "sha256_per_instance"

[timeouts]
solver_seconds = 10.0
run_seconds = 1800.0

[hardware]
device = "cpu"
dtype = "float64"
cpu_threads = 1
cuda_device = "none"
synchronize_cuda = false

[parameters]
study = "replay"
snapshot_directory = "docs/artifacts/raw/m17_review_v1/confirmation/snapshots"
expected_snapshots = 24
widths = [2, 4, 8]
proposal_budgets = [2, 8, 32]
methods = ["rust_exact", "greedy_exact_feasibility", "greedy_witness_reuse"]
audit = true
process_timeout_seconds = 15.0
max_address_space_mib = 2048
