[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mwpc-exact"
version = "0.2.0"
description = "Exact maximum-weight parallel commitment for CFG-constrained diffusion language models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Jota Lizardo" }]
dependencies = []

[project.scripts]
mwpc-repair-json = "mwpc_exact.repair:main"
mwpc-commit-config = "mwpc_exact.strategy:main"
mwpc-resolve-experiment-config = "mwpc_exact.experiments.config:main"

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "hatchling==1.27.0",
  "hypothesis==6.165.10",
  "maturin==1.14.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/mwpc_exact",
  "src/mwpc_research",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/crates", "/tests", "/scripts", "/requirements",
  "/configs", "/docs", "/paper", "/vendor", "/.github", "/.gitmodules",
  "/*.md", "/LICENSE", "/Makefile", "/pyproject.toml", "/rust-toolchain.toml",
]
exclude = [
  "**/target/**", "**/.git/**", "**/.git", "**/__pycache__/**",
  "**/.venv*/**", "**/.cache/**", "**/.pytest_cache/**", "**/.ruff_cache/**",
  "**/.mypy_cache/**", "**/build/**", "**/dist/**", "**/*.so", "**/*.pyc",
  # Full M24 campaigns are research data in Git, not library-installation inputs.
  # Keep the small smoke cohort used by offline regression tests.
  "/docs/artifacts/raw/m24_policy_v1/development/**",
  "/docs/artifacts/raw/m24_policy_v1/confirmation/**",
  "/docs/artifacts/raw/m24_policy_v1/repeat/**",
  "/docs/artifacts/raw/m24_policy_v1/secondary*/**",
  "/docs/artifacts/raw/m24_policy_v1/bfcl*/**",
  # M25 full traces are reproduced from the Git evidence checkout.
  # Keep smoke fixtures and the small interrupted-smoke regression archive.
  "/docs/artifacts/raw/m25_grounded_v1/development/**",
  "/docs/artifacts/raw/m25_grounded_v1/interrupted_development/**",
  "/docs/artifacts/raw/m25_grounded_v1/confirmation/**",
  "/docs/artifacts/raw/m25_grounded_v1/repeat/**",
  "/docs/artifacts/raw/m24_policy_v1/epic_intermediate*/**",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "oracle: exhaustive and differential correctness tests",
  "integration: tests requiring the EPIC submodule or compiled bindings",
  "gpu: tests requiring CUDA and model weights",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["mwpc_exact", "mwpc_research"]
