[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mwpc-exact"
version = "0.1.1"
description = "Exact maximum-weight parallel commitment for CFG-constrained diffusion language models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Jota Lizardo" }]
dependencies = []

[project.scripts]
mwpc-commit-config = "mwpc_exact.strategy:main"
mwpc-resolve-experiment-config = "mwpc_exact.experiments.config:main"

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "hatchling==1.27.0",
  "hypothesis>=6.100",
  "maturin>=1.7",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/mwpc_exact",
  "src/mwpc_research",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "oracle: exhaustive and differential correctness tests",
  "integration: tests requiring the EPIC submodule or compiled bindings",
  "gpu: tests requiring CUDA and model weights",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["mwpc_exact", "mwpc_research"]
