[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mwpc-exact"
version = "0.3.0"
description = "Exact maximum-weight parallel commitment for CFG-constrained diffusion language models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Jota Lizardo" }]
dependencies = []

[project.scripts]
mwpc-commit-config = "mwpc_exact.strategy:main"
mwpc-commit = "mwpc_exact.conflict_cli:main"
mwpc-sample = "mwpc_exact.mass_cli:main"

[project.optional-dependencies]
dev = [
  "build==1.3.0",
  "hatchling==1.27.0",
  "maturin==1.14.1",
  "mypy==2.3.1",
  "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
dev-mode-dirs = ["src"]
packages = [
  "src/mwpc_exact",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/crates", "/scripts", "/requirements",
  "/configs", "/docs", "/paper", "/formal", "/vendor", "/.github",
  "/*.md", "/LICENSE", "/Makefile", "/pyproject.toml", "/rust-toolchain.toml",
]
exclude = [
  "**/target/**", "**/.git/**", "**/.git", "**/__pycache__/**",
  "**/.venv*/**", "**/.cache/**", "**/.pytest_cache/**", "**/.ruff_cache/**",
  "**/.mypy_cache/**", "**/.lake/**", "**/build/**", "**/dist/**", "**/*.so", "**/*.pyc",
  # Full campaign evidence remains in Git, outside library distributions.
  "/docs/artifacts/raw/**",
]


[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["mwpc_exact"]
